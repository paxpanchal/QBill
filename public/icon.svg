<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Core ERP / Document Shield Card -->
  <g filter="url(#dropShadow)">
    <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#accentGrad)"/>
    
    <!-- Stylized QuickBill Emblem -->
    <!-- Invoice Sheet Shape -->
    <path d="M160 148 C160 138 168 130 178 130 L290 130 L352 192 L352 364 C352 374 344 382 334 382 L178 382 C168 382 160 374 160 364 Z" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Folded Corner -->
    <path d="M290 130 L290 182 C290 188 294 192 300 192 L352 192 Z" fill="#cbd5e1"/>

    <!-- Document Lines / Business ERP Grid -->
    <rect x="192" y="218" width="128" height="14" rx="7" fill="#4f46e5"/>
    <rect x="192" y="248" width="96" height="12" rx="6" fill="#94a3b8"/>
    <rect x="192" y="272" width="112" height="12" rx="6" fill="#94a3b8"/>
    
    <!-- AI Sparkle / Lightning Badge in Bottom Right -->
    <circle cx="330" cy="330" r="42" fill="url(#amberGrad)" filter="url(#dropShadow)"/>
    <path d="M330 304 L334 322 L352 326 L334 330 L330 348 L326 330 L308 326 L326 322 Z" fill="#ffffff"/>
    
    <!-- Quick Lightning Accent -->
    <path d="M220 325 L242 295 L234 322 L254 322 L228 355 L234 332 Z" fill="#4f46e5"/>
  </g>
</svg>
